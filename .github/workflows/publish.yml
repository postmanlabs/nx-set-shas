name: "Publish"
on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: jameshenry/publish-shell-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
